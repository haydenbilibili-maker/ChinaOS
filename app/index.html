<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="theme-color" content="#0d1417" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>China OS · 治大国如烹小鲜</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var k = 'c2os-theme';
          var v = localStorage.getItem(k);
          var t = (v === 'light' || v === 'dark') ? v
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          var r = document.documentElement;
          r.setAttribute('data-theme', t);
          r.classList.toggle('dark', t === 'dark');
          var dk = 'chinaos.density.v1';
          var dv = localStorage.getItem(dk);
          var d = (dv === 'compact' || dv === 'comfortable') ? dv : 'comfortable';
          r.setAttribute('data-density', d);
        } catch (e) { /* 隐私模式等 */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
