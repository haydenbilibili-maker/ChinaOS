<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SJ-11 · 商鞅变法</title>
<meta name="description" content="ChinaOS 史鉴变法卷先秦案：商鞅变法——军功爵与编户齐民重塑秦国。"/>
<style>
:root{
  --sj-ink-900:#14110f;
  --sj-ink-800:#1d1916;
  --sj-paper-100:#e8ddc7;
  --sj-paper-300:#cdbe9f;
  --sj-vermil:#a83b2c;
  --sj-celadon:#5f7a6f;
  --sj-ochre:#b8894a;
  --sj-line:#3a322b;
  --sj-radius:6px;
  --sj-space:clamp(12px,2vw,24px);
  --sj-serif:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
  --sj-mono:"Source Han Mono","JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  background:
    radial-gradient(1000px 560px at 72% -8%, #2a221c 0%, transparent 55%),
    radial-gradient(700px 420px at 8% 90%, #1a1612 0%, transparent 50%),
    var(--sj-ink-900);
  color:var(--sj-paper-100);
  font-family:var(--sj-serif);
  line-height:1.75;
}
.sj-11-wrap{max-width:min(100%,1180px);margin:0 auto;padding:var(--sj-space) var(--sj-space) 48px}
@media (min-width:1280px){.sj-11-wrap{max-width:min(100%,1480px)}}
@media (min-width:1536px){.sj-11-wrap{max-width:min(100%,1600px)}}
@media (min-width:1920px){.sj-11-wrap{max-width:min(100%,1680px)}}
@media (min-width:2560px){.sj-11-wrap{max-width:min(100%,1680px)}}/* 宽屏双栏：主栏 ~58% + 粘性侧栏 ~38% */
.sj-page-layout{display:flex;flex-direction:column;gap:var(--sj-space)}
@media (min-width:1280px){
  .sj-page-layout{
    display:grid;
    grid-template-columns:minmax(0,58fr) minmax(280px,38fr);
    gap:clamp(16px,2vw,28px);
    align-items:start;
  }
}
.sj-main-col{min-width:0;width:100%}
.sj-rail{
  display:flex;flex-direction:column;gap:12px;
  min-width:0;width:100%;
}
@media (min-width:1280px){
  .sj-rail{
    position:sticky;top:1rem;align-self:start;
    max-height:calc(100vh - 2rem);overflow-y:auto;overscroll-behavior:contain;
  }
}
@media (max-width:1279px){
  .sj-page-layout{display:flex;flex-direction:column}
  .sj-main-col{display:contents}
  .sj-rail{order:2;margin:8px 0 20px}
  .sj-rail-mini{display:none}
}
.sj-rail-card{
  border:1px solid var(--sj-line);border-radius:var(--sj-radius);
  background:linear-gradient(180deg,var(--sj-ink-800),var(--sj-ink-900));
  padding:14px 16px;
}
.sj-rail-card .k{font-family:var(--sj-mono);font-size:10px;letter-spacing:.16em;color:var(--sj-ochre);margin-bottom:6px}
.sj-rail-card h3,.sj-rail-card h4{font-size:15px;letter-spacing:.06em;margin-bottom:8px;color:var(--sj-paper-100);font-weight:600}
.sj-rail-card p,.sj-rail-card li{font-size:13px;color:var(--sj-paper-300);line-height:1.65}
.sj-rail-card dl{display:grid;gap:6px;margin:0}
.sj-rail-card dt{font-family:var(--sj-mono);font-size:10px;color:var(--sj-ochre);letter-spacing:.06em}
.sj-rail-card dd{font-size:12px;color:var(--sj-paper-300);margin:0;line-height:1.55}
.sj-rail-toc{display:grid;gap:6px;margin-top:8px}
.sj-rail-toc a{
  display:block;border:1px solid var(--sj-line);border-radius:var(--sj-radius);
  padding:8px 10px;text-decoration:none;color:inherit;font-size:13px;
  transition:border-color .18s ease;
}
.sj-rail-toc a:hover,.sj-rail-toc a:focus-visible{border-color:var(--sj-ochre);outline:none}
.sj-rail-toc a.is-active{border-color:var(--sj-vermil)}
.sj-rail-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sj-rail-chip,.sj-rail-chip:visited{
  display:inline-block;font-family:var(--sj-mono);font-size:10px;letter-spacing:.06em;
  color:var(--sj-celadon);border:1px solid var(--sj-line);padding:3px 8px;
  border-radius:var(--sj-radius);text-decoration:none;
}
.sj-rail-chip:hover,.sj-rail-chip:focus-visible{border-color:var(--sj-ochre);color:var(--sj-ochre);outline:none}
.sj-rail-mini{border:1px solid var(--sj-line);border-radius:var(--sj-radius);background:var(--sj-ink-900);padding:6px 6px 2px;overflow:hidden}
.sj-rail-mini svg{display:block;width:100%;height:auto;max-height:200px}
.sj-rail-mini-lbl{font-family:var(--sj-mono);font-size:9px;letter-spacing:.1em;color:var(--sj-paper-300);text-align:center;margin:4px 0 2px}
.sj-rail-steps{display:grid;gap:6px}
.sj-rail-step{
  border:1px solid var(--sj-line);border-radius:var(--sj-radius);padding:8px 10px;
  font-size:13px;color:var(--sj-paper-300);border-left:3px solid var(--sj-line);
  text-decoration:none;
}
.sj-rail-step.is-on{border-left-color:var(--sj-vermil);color:var(--sj-paper-100);background:color-mix(in srgb,var(--sj-vermil) 8%,var(--sj-ink-900))}
.sj-rail-step .n{font-family:var(--sj-mono);font-size:10px;color:var(--sj-ochre);letter-spacing:.08em;display:block;margin-bottom:2px}
.sj-rail-legend{display:grid;gap:4px;margin-top:8px}
.sj-rail-legend span{font-size:12px;color:var(--sj-paper-300);padding-left:12px;border-left:3px solid var(--sj-line)}
.sj-rail-legend .ochre{border-left-color:var(--sj-ochre)}
.sj-rail-legend .celadon{border-left-color:var(--sj-celadon)}
.sj-rail-legend .vermil{border-left-color:var(--sj-vermil)}
.sj-rail-legend .paper{border-left-color:var(--sj-paper-100)}
.sj-rail-legend .ink{border-left-color:var(--sj-paper-300)}
.sj-rail-vols{display:grid;gap:6px}
.sj-rail-vol{
  display:block;border:1px solid var(--sj-line);border-radius:var(--sj-radius);
  padding:8px 10px;text-decoration:none;color:inherit;font-size:13px;
  transition:border-color .18s ease;
}
.sj-rail-vol:hover,.sj-rail-vol:focus-visible{border-color:var(--sj-ochre);outline:none}
.sj-rail-vol .n{font-family:var(--sj-mono);font-size:10px;color:var(--sj-ochre);letter-spacing:.1em}
.sj-rail-snap .sj-snap-note{font-size:11px;line-height:1.5}
.sj-rail-snap .sj-snap-bars{gap:5px}
.sj-rail-refute{font-size:12px;color:var(--sj-paper-300);line-height:1.6;font-style:italic}
.sj-rail-phase-btns{display:grid;gap:6px;margin-top:8px}
.sj-rail-phase-btn{
  appearance:none;border:1px solid var(--sj-line);border-radius:var(--sj-radius);
  padding:8px 10px;background:var(--sj-ink-900);color:var(--sj-paper-300);
  font-family:var(--sj-serif);font-size:12px;text-align:left;cursor:pointer;
  transition:border-color .18s ease,color .18s ease;
}
.sj-rail-phase-btn:hover,.sj-rail-phase-btn:focus-visible{border-color:var(--sj-ochre);color:var(--sj-paper-100);outline:none}
.sj-rail-phase-btn.is-on{border-color:var(--sj-vermil);color:var(--sj-paper-100)}

@keyframes sj-fade-in{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
.sj-reveal-stagger > header,
.sj-reveal-stagger > .sj-zhupi,
.sj-reveal-stagger > .sj-ledger,
.sj-reveal-stagger > [class*="-sec"],
.sj-reveal-stagger > footer{
  animation:sj-fade-in .34s cubic-bezier(.22,.61,.36,1) both;
}
.sj-reveal-stagger > *:nth-child(1){animation-delay:.03s}
.sj-reveal-stagger > *:nth-child(2){animation-delay:.06s}
.sj-reveal-stagger > *:nth-child(3){animation-delay:.09s}
.sj-reveal-stagger > *:nth-child(4){animation-delay:.12s}
.sj-reveal-stagger > *:nth-child(5){animation-delay:.15s}
.sj-reveal-stagger > *:nth-child(6){animation-delay:.18s}
.sj-reveal-stagger > *:nth-child(7){animation-delay:.21s}
.sj-reveal-stagger > *:nth-child(8){animation-delay:.24s}

.sj-11-mast{
  display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding-bottom:16px;border-bottom:1px solid var(--sj-line);margin-bottom:20px;
}
.sj-11-mast .badge{font-family:var(--sj-mono);font-size:11px;letter-spacing:.18em;color:var(--sj-ochre);margin-bottom:6px}
.sj-11-mast h1{font-size:clamp(22px,3vw,28px);font-weight:600;letter-spacing:.16em;line-height:1.3}
.sj-11-mast h1 em{font-style:normal;color:var(--sj-paper-300);font-weight:400;letter-spacing:.08em;font-size:.72em;display:block;margin-top:4px}
.sj-11-meta{font-family:var(--sj-mono);font-size:11px;color:var(--sj-paper-300);text-align:right;line-height:1.7}
.sj-11-meta b{color:var(--sj-ochre);font-weight:500}
.sj-11-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sj-xlinks a,.sj-xlinks a:visited{color:var(--sj-celadon);text-decoration:none}
.sj-xlinks a:hover,.sj-xlinks a:focus-visible{outline:none}
.sj-11-chip,.sj-11-chip:visited{
  display:inline-block;font-family:var(--sj-mono);font-size:10px;
  letter-spacing:.08em;color:var(--sj-celadon);border:1px solid var(--sj-line);
  padding:3px 8px;border-radius:var(--sj-radius);text-decoration:none;
}
.sj-11-chip:hover,.sj-11-chip:focus-visible{border-color:var(--sj-ochre);color:var(--sj-ochre);outline:none}

.sj-zhupi{
  color:var(--sj-vermil);font-size:13.5px;margin:0 0 18px;
  padding-left:12px;border-left:2px solid var(--sj-vermil);max-width:74ch;
}

/* ====== 可复用史鉴台账组件（SJ-09 验证 → 案例卷复用） ====== */
.sj-ledger{display:grid;gap:8px}
.sj-ledger-field{margin:20px 0 8px;scroll-margin-top:24px}
.sj-ledger-fh{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--sj-line);
}
.sj-ledger-fh .fnum{
  font-family:var(--sj-mono);font-size:11px;letter-spacing:.12em;color:var(--sj-ochre);
  border:1px solid var(--sj-line);border-radius:4px;padding:1px 7px;
}
.sj-ledger-fh h2{font-size:clamp(16px,2.1vw,19px);font-weight:600;letter-spacing:.1em}
.sj-ledger-fh .en{font-family:var(--sj-mono);font-size:10px;color:var(--sj-paper-300);letter-spacing:.14em}

.sj-11-prose{font-size:15.5px;color:var(--sj-paper-100);max-width:74ch}
.sj-11-prose + .sj-11-prose{margin-top:12px}
.sj-11-prose strong{color:var(--sj-ochre);font-weight:600}
.sj-11-note{font-size:13px;color:var(--sj-paper-300);margin-top:12px;max-width:74ch}
.sj-11-note b{color:var(--sj-paper-100);font-weight:600}

/* ① 一句话拐点 */
.sj-11-hook{
  border:1px solid var(--sj-line);border-left:3px solid var(--sj-vermil);
  border-radius:var(--sj-radius);background:linear-gradient(180deg,var(--sj-ink-800),var(--sj-ink-900));
  padding:18px 22px;
}
.sj-11-hook p{font-size:clamp(16px,2.3vw,20px);line-height:1.7;color:var(--sj-paper-100);letter-spacing:.02em}
.sj-11-hook p b{color:var(--sj-vermil);font-weight:600}
.sj-11-hook .yr{margin-top:10px;font-family:var(--sj-mono);font-size:11px;color:var(--sj-ochre);letter-spacing:.06em}

/* ② 结构切片 */
.sj-11-stage{width:100%;max-width:100%;
  border:1px solid var(--sj-line);border-radius:var(--sj-radius);
  background:linear-gradient(180deg,var(--sj-ink-800),var(--sj-ink-900));
  box-shadow:0 1px 0 rgba(232,221,199,.04), 0 18px 48px rgba(0,0,0,.45);
  padding:8px 8px 4px;overflow:auto;
}
.sj-11-stage svg{display:block;width:100%;height:auto;max-width:100%;margin:0 auto}
.sj-node{cursor:pointer;transition:opacity .2s ease, filter .2s ease}
.sj-node:focus-visible{outline:2px solid var(--sj-ochre);outline-offset:4px}
.sj-edge{transition:opacity .2s ease, filter .2s ease}
.sj-11-stage.is-picking .sj-node{opacity:.3}
.sj-11-stage.is-picking .sj-node.is-hot{opacity:1;filter:drop-shadow(0 0 6px rgba(184,137,74,.4))}
.sj-11-stage.is-picking .sj-edge{opacity:.16}
.sj-11-stage.is-picking .sj-edge.is-hot{opacity:1;filter:drop-shadow(0 0 3px rgba(168,59,44,.4))}
.sj-11-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,300px);gap:14px;align-items:start;margin-top:14px}
.sj-11-aside{
  border:1px solid var(--sj-line);border-radius:var(--sj-radius);
  background:linear-gradient(180deg,var(--sj-ink-800),var(--sj-ink-900));
  padding:14px 16px;position:sticky;top:12px;min-height:150px;
}
.sj-11-aside .k{font-family:var(--sj-mono);font-size:10px;letter-spacing:.16em;color:var(--sj-ochre);margin-bottom:6px}
.sj-11-aside h3{font-size:16px;letter-spacing:.08em;margin-bottom:8px}
.sj-11-aside p{font-size:13.5px;color:var(--sj-paper-300);line-height:1.7}
.sj-11-aside-empty{font-size:13px;color:var(--sj-paper-300);opacity:.85}

/* ③ 相位 */
.sj-11-phase{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.sj-11-phase .pb{
  font-family:var(--sj-mono);font-size:12px;letter-spacing:.1em;color:var(--sj-vermil);
  border:1px solid var(--sj-vermil);border-radius:20px;padding:6px 16px;white-space:nowrap;
}
.sj-11-phase .pb b{color:var(--sj-ochre);font-weight:500}

/* 表格（④五力 / ⑦映射复用） */
.sj-11-table-wrap{border:1px solid var(--sj-line);border-radius:var(--sj-radius);background:var(--sj-ink-800);overflow:auto;margin-top:6px;min-width:0}
.sj-11-table{width:max(100%,720px);table-layout:fixed;border-collapse:collapse;font-size:13px}
.sj-11-table th{
  background:var(--sj-ink-900);color:var(--sj-ochre);font-family:var(--sj-mono);font-size:10px;
  letter-spacing:.12em;font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--sj-line);white-space:nowrap;
}
.sj-11-table td{padding:10px 12px;border-bottom:1px solid var(--sj-line);color:var(--sj-paper-300);vertical-align:top;line-height:1.6;overflow-wrap:break-word}
.sj-11-table td:first-child{color:var(--sj-paper-100);font-weight:600;white-space:nowrap;min-width:6em}
.sj-11-table .zheng{color:var(--sj-paper-300)}
.sj-11-table .shi{color:var(--sj-paper-100)}

/* ⑤ 史家交锋 */
.sj-11-hist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sj-11-hist article{border:1px solid var(--sj-line);border-radius:var(--sj-radius);background:var(--sj-ink-800);padding:14px 16px}
.sj-11-hist .who{font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--sj-celadon);margin-bottom:6px}
.sj-11-hist .who span{font-family:var(--sj-mono);font-size:10px;color:var(--sj-paper-300);letter-spacing:.08em;margin-left:6px}
.sj-11-hist p{font-size:13px;color:var(--sj-paper-300);line-height:1.65}

/* ⑥ 成败三列 */
.sj-11-verdict{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.sj-11-verdict article{border:1px solid var(--sj-line);border-radius:var(--sj-radius);background:var(--sj-ink-800);padding:14px 16px}
.sj-11-verdict .vh{font-family:var(--sj-mono);font-size:10px;letter-spacing:.12em;margin-bottom:8px}
.sj-11-verdict[data-x] .vh{color:var(--sj-paper-300)}
.sj-11-verdict article.ok .vh{color:var(--sj-celadon)}
.sj-11-verdict article.fail .vh{color:var(--sj-vermil)}
.sj-11-verdict article.open .vh{color:var(--sj-ochre)}
.sj-11-verdict p{font-size:13px;color:var(--sj-paper-300);line-height:1.65}
.sj-11-verdict p + p{margin-top:8px;padding-top:8px;border-top:1px solid var(--sj-line)}

/* ⑦ 古今映射双栏 */
.sj-11-mirror{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sj-11-mirror article{border:1px solid var(--sj-line);border-radius:var(--sj-radius);background:var(--sj-ink-800);padding:14px 16px}
.sj-11-mirror .mh{font-family:var(--sj-mono);font-size:10px;letter-spacing:.12em;margin-bottom:8px}
.sj-11-mirror article.same .mh{color:var(--sj-celadon)}
.sj-11-mirror article.diff .mh{color:var(--sj-ochre)}
.sj-11-mirror p{font-size:13px;color:var(--sj-paper-100);line-height:1.68}
.sj-11-mirror p .lk{color:var(--sj-celadon)}

.sj-11-xref{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.sj-11-xref a{display:block;border:1px solid var(--sj-line);border-radius:var(--sj-radius);background:var(--sj-ink-800);padding:14px 16px;text-decoration:none;color:inherit;transition:border-color .18s}
.sj-11-xref a:hover,.sj-11-xref a:focus-visible{border-color:var(--sj-ochre);outline:none}
.sj-11-xref .n{font-family:var(--sj-mono);font-size:10px;letter-spacing:.14em;color:var(--sj-ochre);margin-bottom:4px}
.sj-11-xref h3{font-size:14px;letter-spacing:.06em;margin-bottom:6px}
.sj-11-xref p{font-size:12.5px;color:var(--sj-paper-300);line-height:1.6}

.sj-11-foot{
  margin-top:40px;padding-top:14px;border-top:1px solid var(--sj-line);
  font-family:var(--sj-mono);font-size:10px;color:var(--sj-paper-300);
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.sj-11-foot a{color:var(--sj-celadon);text-decoration:none}
.sj-11-foot a:hover{color:var(--sj-ochre)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .sj-reveal-stagger > *{animation:none}
  .sj-node,.sj-edge,.sj-11-chip{transition:none}
}
@media (max-width:900px){
  .sj-11-layout{grid-template-columns:1fr}
  .sj-11-aside{position:static}
  .sj-11-hist,.sj-11-mirror{grid-template-columns:1fr}
  .sj-11-verdict{grid-template-columns:1fr}
  .sj-11-xref{grid-template-columns:1fr 1fr}
}
@media (max-width:768px){
  .sj-11-meta{text-align:left}
  .sj-11-xref{grid-template-columns:1fr}
}

/* 宣纸日览 · 由 ?theme=light 或 postMessage 切换 html[data-theme] */
html[data-theme="light"] .sj-rail-card{box-shadow:0 1px 0 rgba(26,24,20,.05),0 12px 28px rgba(26,24,20,.08)}
html[data-theme="light"] .sj-rail-mini{background:var(--sj-ink-800)}
html[data-theme="light"]{
  --sj-ink-900:#f4f1ea;
  --sj-ink-800:#ebe6dc;
  --sj-paper-100:#1a1814;
  --sj-paper-300:#5a5348;
  --sj-vermil:#9a3428;
  --sj-celadon:#3f5f54;
  --sj-ochre:#8a6528;
  --sj-line:#c8bfb0;
}
html[data-theme="light"] body{
  background:
    radial-gradient(1000px 560px at 72% -8%, #e8e4da 0%, transparent 55%),
    radial-gradient(700px 420px at 8% 90%, #ebe6dc 0%, transparent 50%),
    var(--sj-ink-900);
  color:var(--sj-paper-100);
}
html[data-theme="light"] .sj-zhupi{color:var(--sj-vermil)}
html[data-theme="light"] [class*="-stage"],
html[data-theme="light"] [class*="-aside"],
html[data-theme="light"] [class*="-table-wrap"],
html[data-theme="light"] [class*="-hook"],
html[data-theme="light"] [class*="-ledger"]{
  box-shadow:0 1px 0 rgba(26,24,20,.05),0 12px 28px rgba(26,24,20,.08);
}
html[data-theme="light"] .sj-snap-track{background:var(--sj-ink-900);border-color:var(--sj-line)}
html[data-theme="light"] .sj-snap-repair{background:var(--sj-ink-800)}

.sj-rail-mini{font-size:12.5px;color:var(--sj-paper-300);line-height:1.6;margin-top:6px}
</style>

<script>
(function(){
  const stage=document.getElementById('stage');
  if(!stage) return;
  const nodes=Array.from(stage.querySelectorAll('.sj-node'));
  const edges=Array.from(stage.querySelectorAll('.sj-edge'));
  const asideEmpty=document.getElementById('aside-empty');
  const asideBody=document.getElementById('aside-body');
  const NODE_DATA={
  "xiaogong": {
    "name": "秦孝公",
    "tag": "合法性背书 · 虚线",
    "body": "变法依赖孝公个人权威；前338 孝公卒，商鞅遭车裂。"
  },
  "shangyang": {
    "name": "商鞅",
    "tag": "变法引擎",
    "body": "废井田、开阡陌，推行县制、连坐法，以军功爵打开精英通道——把秦国改造成高动员战争—农业国家。"
  },
  "jueti": {
    "name": "军功爵阶梯",
    "tag": "签名 · 通道开放",
    "body": "斩首授爵、累进田宅——寒门/士兵沿阶梯上升，财政与军事动员合一。"
  },
  "shiqing": {
    "name": "世卿世禄",
    "tag": "世袭通道 · 被斩断",
    "body": "旧贵族世袭特权遭摧毁性打击；孝公身后反扑，商鞅车裂——通道置换的死穴。"
  },
  "lianzuo": {
    "name": "连坐什伍",
    "tag": "合法性工具",
    "body": "以严刑峻法替代周礼秩序，短期强化服从，长期积累民怨。"
  },
  "base": {
    "name": "编户耕战底盘",
    "tag": "农战基座",
    "body": "农战体制下的税收与兵役来源，承受严刑峻法的高压——承托一切汲取与动员。"
  }
};
  const NODE_EDGE={
  "xiaogong": [
    "back"
  ],
  "shangyang": [
    "back",
    "ladder",
    "cut"
  ],
  "jueti": [
    "ladder",
    "cut",
    "down"
  ],
  "shiqing": [
    "cut",
    "rebound"
  ],
  "lianzuo": [
    "down"
  ],
  "base": [
    "down",
    "rebound"
  ]
};
  function clearVisual(){stage.classList.remove('is-picking');nodes.forEach(n=>n.classList.remove('is-hot'));edges.forEach(e=>e.classList.remove('is-hot'));}
  function showAside(id){const d=NODE_DATA[id];if(!d)return;asideEmpty.hidden=true;asideBody.hidden=false;document.getElementById('aside-tag').textContent=d.tag;document.getElementById('aside-name').textContent=d.name;document.getElementById('aside-text').textContent=d.body;}
  function pick(id){if(!NODE_DATA[id])return;clearVisual();stage.classList.add('is-picking');nodes.forEach(n=>n.classList.toggle('is-hot',n.dataset.id===id));const hot=NODE_EDGE[id]||[];edges.forEach(e=>e.classList.toggle('is-hot',hot.indexOf(e.dataset.edge)>=0));showAside(id);}
  nodes.forEach(n=>{const act=()=>pick(n.dataset.id);n.addEventListener('click',act);n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});});
  edges.forEach(e=>{if(!e.dataset.edge||!NODE_DATA[e.dataset.edge])return;const act=()=>pick(e.dataset.edge);e.style.cursor='pointer';e.setAttribute('tabindex','0');e.setAttribute('role','button');e.addEventListener('click',act);e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();act();}});});
})();
</script>
</body>
</html>
