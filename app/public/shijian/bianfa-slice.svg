<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="sj-title sj-desc">
  <title id="sj-title">王安石变法 · 结构切片（权力几何）</title>
  <desc id="sj-desc">顶点皇权神宗以虚线合法性竖轴连接新党；新党与旧党水平党争；汲取经胥吏下行至编户客户兼并之家；兼并之家以朱红粗箭头反弹至旧党。</desc>

  <defs>
    <style type="text/css"><![CDATA[
      :root {
        --sj-ink-900: #14110f;
        --sj-ink-800: #1d1916;
        --sj-paper-100: #e8ddc7;
        --sj-paper-300: #cdbe9f;
        --sj-vermil: #a83b2c;
        --sj-celadon: #5f7a6f;
        --sj-ochre: #b8894a;
        --sj-line: #3a322b;
      }
    ]]></style>
    <radialGradient id="sj-paper-glow" cx="48%" cy="28%" r="72%">
      <stop offset="0%" stop-color="var(--sj-ink-800)" stop-opacity="1"/>
      <stop offset="100%" stop-color="var(--sj-ink-900)" stop-opacity="1"/>
    </radialGradient>
    <pattern id="sj-xuan" width="8" height="14" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="8" y2="1" stroke="var(--sj-paper-100)" stroke-width="0.4" opacity="0.35"/>
    </pattern>
    <linearGradient id="sj-base-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241e19"/>
      <stop offset="100%" stop-color="#100e0c"/>
    </linearGradient>
    <marker id="arr-ochre" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="var(--sj-ochre)"/>
    </marker>
    <marker id="arr-celadon" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--sj-celadon)"/>
    </marker>
    <marker id="arr-vermil" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--sj-vermil)"/>
    </marker>
    <marker id="arr-vermil-hi" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L11,5 L0,10 Z" fill="var(--sj-vermil)"/>
    </marker>
    <marker id="arr-paper" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="var(--sj-paper-300)"/>
    </marker>
    <!-- 双向党争左端箭头 -->
    <marker id="arr-vermil-start" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto">
      <path d="M7,0 L0,3 L7,6 Z" fill="var(--sj-vermil)"/>
    </marker>
  </defs>

  <rect width="800" height="640" fill="url(#sj-paper-glow)"/>
  <rect x="48" y="88" width="704" height="510" fill="url(#sj-xuan)" opacity="0.045"/>

  <!-- 卷轴轴头 -->
  <g aria-hidden="true" opacity="0.7">
    <rect x="16" y="96" width="12" height="480" rx="5" fill="none" stroke="var(--sj-ochre)" stroke-width="1.2"/>
    <rect x="20" y="100" width="4" height="472" rx="2" fill="var(--sj-line)"/>
    <rect x="772" y="96" width="12" height="480" rx="5" fill="none" stroke="var(--sj-ochre)" stroke-width="1.2"/>
    <rect x="776" y="100" width="4" height="472" rx="2" fill="var(--sj-line)"/>
  </g>

  <!-- 页眉 -->
  <text x="48" y="36" fill="var(--sj-paper-100)" font-size="20" font-weight="600" font-family="Songti SC, Noto Serif SC, Source Han Serif SC, serif" letter-spacing="0.12em">结构切片 · 权力几何</text>
  <text x="48" y="58" fill="var(--sj-ochre)" font-size="11" font-family="Source Han Mono, JetBrains Mono, ui-monospace, monospace" letter-spacing="0.08em">SJ-05 · 王安石变法 · 台账字段②</text>
  <text x="48" y="76" fill="var(--sj-vermil)" font-size="11" font-family="Songti SC, Noto Serif SC, serif">点击「皇权」→ 虚线竖轴 · 点击「反弹」→ 死穴链</text>

  <!-- ========== 边层（先画） ========== -->
  <g id="edges" fill="none" stroke-linecap="round">
    <!-- 脆弱合法性竖轴：皇权 → 新党（虚线，不可实线） -->
    <path class="sj-edge" data-edge="axis" data-role="axis"
          d="M400,128 L400,168 L248,168 L248,198"
          stroke="var(--sj-ochre)" stroke-width="2.2" stroke-dasharray="5 5"
          marker-end="url(#arr-ochre)" opacity="0.9"/>

    <!-- 水平党争：新党 ↔ 旧党（双向） -->
    <path class="sj-edge" data-edge="faction" data-role="faction"
          d="M308,230 H518"
          stroke="var(--sj-vermil)" stroke-width="2.4" opacity="0.85"
          marker-start="url(#arr-vermil-start)" marker-end="url(#arr-vermil)"/>

    <!-- 下行汲取：新党 → 胥吏 -->
    <path class="sj-edge" data-edge="extract-1" data-role="extract"
          d="M248,262 C248,300 300,318 360,332"
          stroke="var(--sj-ochre)" stroke-width="2.6" marker-end="url(#arr-ochre)" opacity="0.9"/>

    <!-- 下行汲取：胥吏 → 底盘 -->
    <path class="sj-edge" data-edge="extract-2" data-role="extract"
          d="M400,378 C400,410 400,430 400,458"
          stroke="var(--sj-ochre)" stroke-width="2.4" marker-end="url(#arr-ochre)" opacity="0.85"/>

    <!-- 反弹回路（死穴）：兼并之家 → 旧党 —— 视觉权重最高 -->
    <path class="sj-edge" data-edge="rebound" data-role="rebound"
          d="M560,468 C620,420 640,340 590,278"
          stroke="var(--sj-vermil)" stroke-width="5.2"
          marker-end="url(#arr-vermil-hi)" opacity="1"/>
  </g>

  <!-- 边标签 / 朱批 -->
  <g class="sj-label" data-role="axis" font-family="Songti SC, Noto Serif SC, serif">
    <circle cx="418" cy="150" r="4" fill="none" stroke="var(--sj-vermil)" stroke-width="1.2"/>
    <text x="430" y="144" fill="var(--sj-vermil)" font-size="12">合法性支柱 · 1085 抽走即翻盘</text>
    <text x="430" y="162" fill="var(--sj-paper-300)" font-size="10" font-family="Source Han Mono, JetBrains Mono, ui-monospace, monospace">虚线 = 依赖个人背书</text>
  </g>
  <g class="sj-label" data-role="faction" font-family="Songti SC, Noto Serif SC, serif">
    <text x="413" y="218" text-anchor="middle" fill="var(--sj-vermil)" font-size="11">义利之辩 · 党争制度化</text>
  </g>
  <g class="sj-label" data-role="extract" font-family="Songti SC, Noto Serif SC, serif">
    <text x="278" y="310" fill="var(--sj-ochre)" font-size="11">汲取重建</text>
  </g>
  <g class="sj-label" data-role="rebound" font-family="Songti SC, Noto Serif SC, serif">
    <circle cx="638" cy="360" r="5" fill="none" stroke="var(--sj-vermil)" stroke-width="1.4"/>
    <text x="650" y="348" fill="var(--sj-vermil)" font-size="13" font-weight="600">触动特权 → 精英反弹</text>
    <text x="650" y="366" fill="var(--sj-paper-300)" font-size="10" font-family="Source Han Mono, JetBrains Mono, ui-monospace, monospace">死穴 · 全图要点</text>
  </g>

  <!-- ========== 节点层 ========== -->
  <!-- 顶点：皇权·神宗（赭金） -->
  <g class="sj-node" data-id="throne" id="node-throne" tabindex="0" role="button" aria-label="皇权神宗，合法性支柱">
    <ellipse cx="400" cy="112" rx="78" ry="28" fill="#2a2218" stroke="var(--sj-ochre)" stroke-width="2.6"/>
    <text x="400" y="108" text-anchor="middle" fill="var(--sj-ochre)" font-size="15" font-weight="600" font-family="Songti SC, Noto Serif SC, serif" letter-spacing="0.08em">皇权 · 神宗</text>
    <text x="400" y="124" text-anchor="middle" fill="var(--sj-paper-300)" font-size="10" font-family="Source Han Mono, JetBrains Mono, ui-monospace, monospace">合法性支柱</text>
  </g>

  <!-- 左：王安石·新党（青瓷，略小——不可与旧党等权） -->
  <g class="sj-node" data-id="new-party" id="node-new" tabindex="0" role="button" aria-label="王安石新党">
    <rect x="178" y="198" width="140" height="64" rx="6" fill="var(--sj-ink-800)" stroke="var(--sj-celadon)" stroke-width="2"/>
    <text x="248" y="224" text-anchor="middle" fill="var(--sj-celadon)" font-size="14" font-family="Songti SC, Noto Serif SC, serif">王安石 · 新党</text>
    <text x="248" y="244" text-anchor="middle" fill="var(--sj-paper-300)" font-size="11" font-family="Songti SC, Noto Serif SC, serif">技术官僚 · 财政重建</text>
  </g>

  <!-- 右：司马光·旧党（朱红，略大——视觉更重） -->
  <g class="sj-node" data-id="old-party" id="node-old" tabindex="0" role="button" aria-label="司马光旧党">
    <rect x="520" y="192" width="168" height="76" rx="6" fill="#241612" stroke="var(--sj-vermil)" stroke-width="2.8"/>
    <text x="604" y="222" text-anchor="middle" fill="var(--sj-vermil)" font-size="15" font-weight="600" font-family="Songti SC, Noto Serif SC, serif">司马光 · 旧党</text>
    <text x="604" y="244" text-anchor="middle" fill="var(--sj-paper-300)" font-size="11" font-family="Songti SC, Noto Serif SC, serif">士大夫共识 · 精英抵制</text>
  </g>

  <!-- 中层：地方胥吏（灰） -->
  <g class="sj-node" data-id="clerks" id="node-clerks" tabindex="0" role="button" aria-label="地方胥吏执行层">
    <rect x="300" y="332" width="200" height="46" rx="5" fill="var(--sj-ink-800)" stroke="var(--sj-paper-300)" stroke-width="1.6"/>
    <text x="400" y="350" text-anchor="middle" fill="var(--sj-paper-300)" font-size="13" font-family="Songti SC, Noto Serif SC, serif">地方胥吏</text>
    <text x="400" y="368" text-anchor="middle" fill="var(--sj-paper-300)" font-size="10" font-family="Source Han Mono, JetBrains Mono, ui-monospace, monospace" opacity="0.9">执行层 · 青苗免役扭曲</text>
  </g>

  <!-- 底盘：编户齐民 · 客户 · 兼并之家 -->
  <g class="sj-node" data-id="base" id="node-base" tabindex="0" role="button" aria-label="编户齐民客户兼并之家底盘">
    <rect x="56" y="468" width="688" height="100" rx="6" fill="url(#sj-base-fill)" stroke="var(--sj-line)" stroke-width="1.4"/>
    <path d="M80,520 C160,500 240,540 320,520 S480,500 560,520 S680,540 720,516"
          fill="none" stroke="var(--sj-paper-300)" stroke-width="1" opacity="0.28"/>
    <text x="400" y="500" text-anchor="middle" fill="var(--sj-paper-100)" font-size="14" font-family="Songti SC, Noto Serif SC, serif" letter-spacing="0.12em">编户齐民 · 客户 · 兼并之家</text>
    <text x="220" y="528" text-anchor="middle" fill="var(--sj-paper-300)" font-size="10" font-family="Source Han Mono, JetBrains Mono, ui-monospace, monospace">编户 / 客户</text>
    <text x="560" y="528" text-anchor="middle" fill="var(--sj-vermil)" font-size="11" font-family="Songti SC, Noto Serif SC, serif">兼并之家（反弹起点）</text>
    <text x="400" y="552" text-anchor="middle" fill="var(--sj-paper-300)" font-size="10" font-family="Songti SC, Noto Serif SC, serif" opacity="0.8">基座承托 · 汲取落点 · 特权回流</text>
  </g>

  <!-- 图例 -->
  <g font-family="Source Han Mono, JetBrains Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.06em">
    <circle cx="56" cy="600" r="4" fill="var(--sj-ochre)"/><text x="66" y="603" fill="var(--sj-paper-300)">皇权/汲取</text>
    <circle cx="150" cy="600" r="4" fill="var(--sj-celadon)"/><text x="160" y="603" fill="var(--sj-paper-300)">新党</text>
    <circle cx="214" cy="600" r="4" fill="var(--sj-vermil)"/><text x="224" y="603" fill="var(--sj-paper-300)">旧党/反弹</text>
    <circle cx="310" cy="600" r="4" fill="var(--sj-paper-300)"/><text x="320" y="603" fill="var(--sj-paper-300)">胥吏</text>
    <line x1="380" y1="600" x2="402" y2="600" stroke="var(--sj-ochre)" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="408" y="603" fill="var(--sj-paper-300)">虚线竖轴</text>
    <line x1="490" y1="600" x2="518" y2="600" stroke="var(--sj-vermil)" stroke-width="4"/>
    <text x="524" y="603" fill="var(--sj-paper-300)">反弹死穴</text>
  </g>
  <text x="744" y="603" text-anchor="end" fill="var(--sj-line)" font-size="9" font-family="Source Han Mono, JetBrains Mono, ui-monospace, monospace">viewBox 800×640 · 规格 §3</text>
</svg>